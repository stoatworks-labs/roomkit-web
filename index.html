    <noscript>
      <h1>roomkit</h1>
      <p>Design 3D-printable room treatment in the browser and download files ready for the slicer: Helmholtz bass traps tuned to a frequency you type, to the peaks in a REW measurement, or to your room's axial modes, and quadratic-residue diffusers, 2D "skyline" tiles and 1D QRD wells.</p>
      <p>Everything runs in your browser, and it needs JavaScript: the CAD kernel is OpenCascade compiled to WebAssembly, so nothing you enter or upload leaves the page. Downloads are 3MF, STL and optionally STEP. None of the designs it makes has been printed and acoustically measured yet.</p>
      <p><a href="https://github.com/stoatworks-labs/roomkit-web">Source on GitHub</a> · <a href="https://stoatworks-labs.com/">Stoatworks Labs</a></p>
