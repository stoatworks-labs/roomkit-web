<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>roomkit</title>
    <meta name="description" content="Design 3D-printable Helmholtz bass traps tuned to your room's modes or a REW measurement, and quadratic-residue diffusers. Download STL, 3MF and STEP, built in your browser." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      About dialog. Both files are vendored from stoatworks-backend/about and
      generated by its sync-about.py — edit them there, never here.
    -->
    <script src="/about-data.js" defer></script>
    <script src="/about.js" defer></script>
    <!--
      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-run that repo's scripts/sync-support-footer.sh, never here.
      Classic + defer on purpose: it reads its config off this tag, and
      document.currentScript is null inside a module.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="roomkit"
      data-repo="https://github.com/stoatworks-labs/roomkit-web"
      data-note="It runs entirely in your browser — no account, and nothing you enter or upload leaves the page."
    ></script>
  </body>
</html>
